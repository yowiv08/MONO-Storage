<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <script>
      (() => {
        let preference;
        try { preference = localStorage.getItem('mono-theme'); } catch {}
        const theme = preference === 'light' || preference === 'dark' ? preference : matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
        document.documentElement.style.backgroundColor = theme === 'dark' ? '#17191d' : '#fafafa';
        document.querySelector('meta[name="theme-color"]').content = theme === 'dark' ? '#17191d' : '#fafafa';
      })();
    </script>
    <meta name="description" content="MONO — 轻简的对象存储控制台" />
    <title>MONO · 对象存储</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
